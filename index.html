<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CannaDose</title>
</head>
<body class="">

    <h1 class="">CannaDose</h1>

    <div class="create_product">

        <h3>Save cannabis product</h3>

        <div class="form_group">

            <form id="product_form">

                <div class="form_group">
                    <select name="product_types" id="product_types">
                        <option value="flower">Flower</option>
                        <option value="vape">Vape</option>
                        <option value="sand">Sand</option>
                        <option value="wax">Wax</option>
                        <option value="troche">Troche</option>
                        <option value="tincture">Tincture</option>
                    </select>
                </div>

                <!-- Flower Specifications -->
                <div class="form_group">
                    <select name="flower_specification" id="flower_specification">
                        <option value="nug">Full Nug</option>
                        <option value="premium">Premium</option>
                        <option value="small">Small Buds</option>
                        <option value="popcorn">Popcorn Buds</option>
                        <option value="mixed">Mixed Buds</option>
                        <option value="rough">Rough cut</option>
                        <option value="shake">Shake</option>
                        <option value="ground">Ground</option>
                        <option value="infused">Infused ground</option>
                    </select>
                </div>

                <!-- Vape Specifications -->
                <div class="form_group">
                    <select name="vape_specification" id="vape_specification" hidden>
                        <option value="resin">Live Resin</option> 
                        <option value="rosin">Live Rosin</option>
                        <option value="distillate">Live Resin Distillate</option>
                        <option value="sauce">Live Sauce</option>
                        <option value="co2">CO2</option>
                        <option value="oil">Oil</option>
                    </select>
                </div>

                <div class="form_group">
                    <select name="vape_specification_2" id="vape_specification_2" hidden>
                        <option value="cartridge">Cartridge</option>
                        <option value="disposable">Disposable</option>
                        <option value="pod">Pod</option>
                    </select>
                </div>

                <!-- Wax Specifications -->
                <div class="form_group">
                    <select name="wax_specification" id="wax_specification" hidden>
                        <option value="budder">Budder</option>
                        <option value="badder">Badder</option>
                        <option value="sugar">Sugar</option>
                        <option value="crumble">Crumble</option>
                        <option value="shatter">Shatter</option>
                        <option value="resin">Live Resin</option>
                        <option value="rosin">Live Rosin</option>
                        <option value="sauce">Live Sauce</option>
                        <option value="honeycomb">Honeycomb</option>
                    </select>
                </div>

                <!-- Flower, vape, sand, wax -->
                <div id="weight_product" class="product_section">
                    <div class="form_group">
                        <!-- <label for="concentration_unit">THC measurement:</label> -->
                        <select id="concentration_unit" name="concentration_unit">
                            <option value="percent">Percent (%)</option>
                            <option value="mg">Milligrams (mg)</option>
                        </select>
                    </div>

                    <div class="form_group">
                        <!-- <label for="concentration" id="concentration_label">
                            THC concentration (%):
                        </label> -->
                        <input
                            type="number"
                            id="concentration"
                            name="concentration"
                            min="0"
                            max="100"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <!-- <label for="concentration_thca">THCA concentration (%):</label> -->
                        <input
                            type="number"
                            id="concentration_thca"
                            name="concentration_thca"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="THCA %"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <!-- <label for="total_weight">Total product weight:</label> -->
                        <input
                            type="number"
                            id="total_weight"
                            name="total_weight"
                            min="0.1"
                            max="100"
                            step="0.1"
                            placeholder="Total weight"
                            required
                        >
                        <select id="weight_unit" name="weight_unit">
                            <option value="grams">Grams</option>
                            <option value="ounces">Ounces</option>
                        </select>
                    </div>
                </div>
                
                <!-- Troche -->
                <div id="troche_product" class="product_section" hidden>
                    <div class="form_group">
                        <!-- <label for="troche_mg">THC per package (mg):</label> -->
                        <input
                            type="number"
                            id="troche_mg"
                            name="troche_mg"
                            min="1"
                            step="1"
                            value="1"
                            placeholder="THC"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <!-- <label for="total_servings">Total servings:</label> -->
                        <input
                            type="number"
                            id="total_servings"
                            name="total_servings"
                            min="1"
                            step="1"
                            value="1"
                            required
                        >
                    </div>
                </div>

                <!-- Tincture -->
                <div id="tincture_product" class="product_section" hidden>
                    <div class="form_group">
                        <!-- <label for="mg_per_bottle">THC mg per bottle:</label> -->
                        <input
                            type="number"
                            id="mg_per_bottle"
                            name="mg_per_bottle"
                            min="1"
                            step="1"
                            value="1"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <!-- <label for="total_volume">Total product volume (mL):</label> -->
                        <input
                            type="number"
                            id="total_volume"
                            name="total_volume"
                            min="0.1"
                            step="0.1"
                            value="100"
                            required
                        >
                    </div>
                </div>

                <div class="form_group">
                    <input type="text" id="brand_name" name="brand_name" placeholder="Brand Name" required>
                </div>

                <div class="form_group">
                    <input type="text" id="product_name" name="product_name" placeholder="Strain Name" required>
                </div>

                <div class="form_group">
                    <label>
                        <input type="radio" value="hybrid" name="strain_types" required> 
                        Hybrid
                    </label>
                    <label>
                        <input type="radio" value="indica" name="strain_types"> 
                        Indica
                    </label>
                    <label>
                        <input type="radio" value="sativa" name="strain_types"> 
                        Sativa
                    </label>
                    <label>
                        <input type="radio" value="indica_dominant" name="strain_types"> 
                        Indica-dominant
                    </label>
                    <label>
                        <input type="radio" value="sativa_dominant" name="strain_types"> 
                        Sativa-dominant
                    </label>
                </div>

                <button type="submit">SAVE PRODUCT</button>
                <output id="save_product_message" aria-live="polite"></output>
            </form>

        </div>

    </div>

    <div class="product_calculation">

        <h3>Calculate consumed THC in mg</h3>

        <div class="form_group">

            <form id="calculation_form">

                <div class="form_group">
                    <label for="serving_selection">Select product:</label>
                    <select name="serving_selection" id="serving_selection" required>
                        <!-- option elements added by JS -->
                    </select>
                </div>

                <div class="form_group">

                    <!-- Flower, vape, sand, wax -->
                    <div id="fvsw_serving" class="calculation_section">
                        <div class="form_group">
                            <label for="consumed_weight">Weight consumed:</label>
                            <input
                                type="number"
                                id="consumed_weight"
                                name="consumed_weight"
                                min="0.1"
                                step="0.1"
                                value="1"
                                required
                            >
                            <select id="consumed_weight_unit"
                                    name="consumed_weight_unit">
                                <option value="grams">Grams</option>
                                <option value="ounces">Ounces</option>
                            </select>
                        </div>
                    </div>

                    <!-- Troche -->
                    <div id="troche_serving" class="calculation_section" hidden>
                        <div class="form_group">
                            <label for="consumed_servings">Servings consumed:</label>
                            <input
                                type="number"
                                id="consumed_servings"
                                name="consumed_servings"
                                min="1"
                                step="1"
                                value="1"
                                required
                            >
                        </div>
                    </div>

                    <!-- Tincture -->
                    <div id="tincture_serving" class="calculation_section" hidden>
                        <div class="form_group">
                            <label for="consumed_volume">Volume consumed (mL):</label>
                            <input
                                type="number"
                                id="consumed_volume"
                                name="consumed_volume"
                                min="0.1"
                                step="0.1"
                                value="1"
                                required
                            >
                        </div>
                    </div>

                </div>

                <button type="submit">Calculate THC</button>
                <output id="calculation_message" aria-live="polite"></output>
            </form>

        </div>

    </div>

    <!-- Handles input changes for different product types -->
    <script>
        { // Display products from local storage.
            const productSelect = document.getElementById("serving_selection");

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);

                if (value) {
                    // Parse data.
                    const parsedData = JSON.parse(value);

                    // Create element.
                    let optionElement = document.createElement("option");

                    // Set content and attributes.
                    const productType = parsedData.product_type; // flower, vape, wax, sand, troche, tincture
                    console.log("Line 347: productType ", productType)

                    let vapeSpec;
                    let vapeSpecToTitle;
                    if (productType == 'vape') {
                        vapeSpec = parsedData.vape_spec_type;
                        console.log("Line 352: vapeSpec ", vapeSpec)
                        vapeSpecToTitle = toTitleCase(vapeSpec);
                    }

                    console.log("Line 352: ", productType == "vape")
                    let typeToTitle;
                    if (productType) {
                        console.log("Line 358: productType: ", productType);
                        typeToTitle = toTitleCase(productType);
                    }

                    const spec = parsedData.product_specification;
                    let specTitle;
                    if (spec) {
                        switch (spec) {
                            case "nug":
                                specTitle = "Full Nugs";
                                break;
                            case "premium":
                                specTitle = "Premium";
                                break;
                            case "small":
                                specTitle = "Small Buds";
                                break;
                            case "mixed":
                                specTitle = "Mixed Buds";
                                break;
                            case "rough":
                                specTitle = "Rough Cut";
                                break;
                            case "shake":
                                specTitle = "Shake";
                                break;
                            case "ground": 
                                specTitle = "Ground";
                                break;
                            case "infused":
                                specTitle = "Infused Ground";
                                break;
                            case "resin":
                                specTitle = "Live Resin";
                                break;
                            case "rosin":
                                specTitle = "Live Rosin";
                                break;
                            case "sauce":
                                specTitle = "Live Sauce";
                                break;
                            case "distillate":
                                specTitle = "Live Resin Distillate";
                                break;
                            case "co2":
                                specTitle = "CO2";
                                break;
                            case "oil":
                                specTitle = "Oil";
                                break;
                            case "budder":
                                specTitle = "Budder";
                                break;
                            case "badder":
                                specTitle = "Badder";
                                break;
                            case "sugar":
                                specTitle = "Sugar";
                                break;
                            case "crumble":
                                specTitle = "Crumble";
                                break;
                            case "shatter":
                                specTitle = "Shatter";
                                break;
                            case "honeycomb":
                                specTitle = "Honeycomb";
                                break;
                            default:
                                break;
                        }
                        if (typeof vapeSpec === 'undefined') {
                            optionElement.text = parsedData.brand_name + ' ' + parsedData.product_name + ' ' + specTitle + ' ' + typeToTitle;
                        } else {
                            optionElement.text = parsedData.brand_name + ' ' + parsedData.product_name + ' ' + specTitle + ' ' + typeToTitle + ' ' + vapeSpecToTitle;
                        }
                    } else {
                        optionElement.text = parsedData.brand_name + ' ' + parsedData.product_name + ' ' + typeToTitle;
                    }
                    
                    const type = parsedData.product_type;
                    if (["flower", "vape", "wax", "sand"].includes(type)) {
                        optionElement.className = "weight";
                    } else {
                        optionElement.className = type;
                    }
                    
                    optionElement.value = key;
                    optionElement.className = parsedData.product_type;

                    // Add to the DOM
                    productSelect.appendChild(optionElement);
                } else {
                    console.log(`Error: key (${key}) not found.`);
                }
            }
        }

        { // Product save section
            const productSelect = document.getElementById("product_types");

            const sections = {
                weight: document.getElementById("weight_product"),
                troche: document.getElementById("troche_product"),
                tincture: document.getElementById("tincture_product"),
            };

            const specifications = {
                flower: document.getElementById("flower_specification"),
                vape: document.getElementById("vape_specification"),
                wax: document.getElementById("wax_specification")
            };

            const vapeSpecType = document.getElementById("vape_specification_2");

            function updateProductFields() {
                const product = productSelect.value;

                const section =
                    product === "troche" ? "troche" :
                    product === "tincture" ? "tincture" :
                    "weight";

                for (const [key, element] of Object.entries(sections)) {
                    const isActive = key === section;

                    element.hidden = !isActive;

                    // Hidden fields should not be required or submitted.
                    element.querySelectorAll("input, select").forEach(input => {
                        input.disabled = !isActive;
                    });
                }

                const specification = 
                    product === "flower" ? "flower" :
                    product === "vape" ? "vape" :
                    product === "wax" ? "wax" : 
                    null;

                for (const [key, element] of Object.entries(specifications)) {
                    const isActive = key === specification;

                    if (key == "vape") {
                        vapeSpecType.hidden = !isActive;
                        vapeSpecType.querySelectorAll("input, select").forEach(input => {
                            input.disabled = !isActive;
                        });
                    }

                    element.hidden = !isActive;

                    // Hidden fields should not be required or submitted.
                    element.querySelectorAll("input, select").forEach(input => {
                        input.disabled = !isActive;
                    });
                }
            }

            productSelect.addEventListener("change", updateProductFields);

            const concentrationUnit =
                document.getElementById("concentration_unit");

            const concentration =
                document.getElementById("concentration");

            function updateConcentrationFields() {
                const isPercent = concentrationUnit.value === "percent";

                concentration.min = isPercent ? "0" : "1";
                concentration.max = isPercent ? "100" : "1000";
                concentration.step = isPercent ? "0.01" : "1";
                concentration.placeholder = isPercent ? "THC %" : "THC mg"
            }

            concentrationUnit.addEventListener(
                "change",
                updateConcentrationFields
            );

            updateProductFields();
            updateConcentrationFields();
        }

        { // Calculate consumed dose section
            const calculationSelect = document.getElementById("serving_selection");

            const sections = {
                weight: document.getElementById("fvsw_serving"),
                troche: document.getElementById("troche_serving"),
                tincture: document.getElementById("tincture_serving")
            };

            function updateProductFields() {
                const productClass = calculationSelect.options[calculationSelect.selectedIndex].className;

                const section =
                    productClass === "troche" ? "troche" :
                    productClass === "tincture" ? "tincture" :
                    "weight";

                for (const [key, element] of Object.entries(sections)) {
                    const isActive = key === section;

                    element.hidden = !isActive;

                    // Hidden fields should not be required or submitted.
                    element.querySelectorAll("input, select").forEach(input => {
                        input.disabled = !isActive;
                    });
                }
            }

            calculationSelect.addEventListener("change", updateProductFields);
        }
    
        /**
         * Capitalize first letter of a string.
         * 
         * @param {string} string
         */
        function toTitleCase(string) {
            console.log("Line 615: string ", string);
            console.log("Line 616: string to title ", string.toLowerCase().replace(/\b\w/g, s => s.toUpperCase()));
            return string.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
