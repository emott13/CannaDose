<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CannaDose</title>
</head>
<body class="">

    <h1 class="">CannaDose</h1>

    <div class="create_product">

        <h3>Save cannabis product</h3>

        <div class="form_group">

            <form id="product_form">

                <div class="form_group">
                    <select name="product_types" id="product_types">
                        <option value="flower">Flower</option>
                        <option value="vape">Vape</option>
                        <option value="sand">Sand</option>
                        <option value="wax">Wax</option>
                        <option value="troche">Troche</option>
                        <option value="tincture">Tincture</option>
                    </select>
                </div>

                <!-- Flower Specifications -->
                <div class="form_group">
                    <select name="flower_specification" id="flower_specification">
                        <option value="nug">Full Nug</option>
                        <option value="premium">Premium</option>
                        <option value="small">Small Buds</option>
                        <option value="popcorn">Popcorn Buds</option>
                        <option value="mixed">Mixed Buds</option>
                        <option value="rough">Rough cut</option>
                        <option value="shake">Shake</option>
                        <option value="ground">Ground</option>
                        <option value="infused">Infused ground</option>
                    </select>
                </div>

                <!-- Vape Specifications -->
                <div class="form_group">
                    <select name="vape_specification" id="vape_specification" hidden>
                        <option value="resin">Live Resin</option> 
                        <option value="rosin">Live Rosin</option>
                        <option value="distillate">Live Resin Distillate</option>
                        <option value="sauce">Live Sauce</option>
                        <option value="co2">CO2</option>
                        <option value="oil">Oil</option>
                    </select>
                </div>

                <div class="form_group">
                    <select name="vape_specification_2" id="vape_specification_2" hidden>
                        <option value="cartridge">Cartridge</option>
                        <option value="disposable">Disposable</option>
                        <option value="pod">Pod</option>
                    </select>
                </div>

                <!-- Wax Specifications -->
                <div class="form_group">
                    <select name="wax_specification" id="wax_specification" hidden>
                        <option value="budder">Budder</option>
                        <option value="badder">Badder</option>
                        <option value="sugar">Sugar</option>
                        <option value="crumble">Crumble</option>
                        <option value="shatter">Shatter</option>
                        <option value="resin">Live Resin</option>
                        <option value="rosin">Live Rosin</option>
                        <option value="sauce">Live Sauce</option>
                        <option value="honeycomb">Honeycomb</option>
                    </select>
                </div>

                <!-- Flower, vape, sand, wax -->
                <div id="weight_product" class="product_section">
                    <div class="form_group">
                        <select id="concentration_unit" name="concentration_unit">
                            <option value="percent">Percent (%)</option>
                            <option value="mg">Milligrams (mg)</option>
                        </select>
                    </div>

                    <div class="form_group">
                        <input
                            type="number"
                            id="concentration"
                            name="concentration"
                            min="0"
                            max="100"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <!-- <label for="concentration_thca">THCA concentration (%):</label> -->
                        <input
                            type="number"
                            id="concentration_thca"
                            name="concentration_thca"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="THCA %"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <!-- <label for="total_weight">Total product weight:</label> -->
                        <input
                            type="number"
                            id="total_weight"
                            name="total_weight"
                            min="0.1"
                            max="100"
                            step="0.1"
                            placeholder="Total weight"
                            required
                        >
                        <select id="weight_unit" name="weight_unit">
                            <option value="grams">Grams</option>
                            <option value="ounces">Ounces</option>
                        </select>
                    </div>
                </div>
                
                <!-- Troche -->
                <div id="troche_product" class="product_section" hidden>
                    <div class="form_group">
                        <!-- <label for="troche_mg">THC per package (mg):</label> -->
                        <input
                            type="number"
                            id="troche_mg"
                            name="troche_mg"
                            min="1"
                            step="1"
                            placeholder="THC mg per serving"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <!-- <label for="total_servings">Total servings:</label> -->
                        <input
                            type="number"
                            id="total_servings"
                            name="total_servings"
                            min="1"
                            step="1"
                            placeholder="Total servings per package"
                            required
                        >
                    </div>
                </div>

                <!-- Tincture -->
                <div id="tincture_product" class="product_section" hidden>
                    <div class="form_group">
                        <!-- <label for="mg_per_bottle">THC mg per bottle:</label> -->
                        <input
                            type="number"
                            id="mg_per_bottle"
                            name="mg_per_bottle"
                            min="1"
                            step="1"
                            placeholder="THC mg per bottle"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <!-- <label for="total_volume">Total product volume (mL):</label> -->
                        <input
                            type="number"
                            id="total_volume"
                            name="total_volume"
                            min="0.1"
                            step="0.1"
                            placeholder="Bottle volume in mL"
                            required
                        >
                    </div>
                </div>

                <div class="form_group">
                    <input type="text" id="brand_name" name="brand_name" placeholder="Brand Name" required>
                </div>

                <div class="form_group">
                    <input type="text" id="product_name" name="product_name" placeholder="Strain Name" required>
                </div>

                <div class="form_group">
                    <label>
                        <input type="radio" value="hybrid" name="strain_types" required> 
                        Hybrid
                    </label>
                    <label>
                        <input type="radio" value="indica" name="strain_types"> 
                        Indica
                    </label>
                    <label>
                        <input type="radio" value="sativa" name="strain_types"> 
                        Sativa
                    </label>
                    <label>
                        <input type="radio" value="indica_dominant" name="strain_types"> 
                        Indica-dominant
                    </label>
                    <label>
                        <input type="radio" value="sativa_dominant" name="strain_types"> 
                        Sativa-dominant
                    </label>
                </div>

                <button type="submit">SAVE PRODUCT</button>
                <output id="save_product_message" aria-live="polite"></output>
            </form>

        </div>

    </div>

    <div class="product_calculation">

        <h3>Calculate consumed THC in mg</h3>

        <div class="form_group">

            <form id="calculation_form">

                <div class="form_group">
                    <label for="serving_selection">Select product:</label>
                    <select name="serving_selection" id="serving_selection" required>
                        <!-- option elements added by JS -->
                    </select>
                </div>

                <div class="form_group">

                    <!-- Flower, vape, sand, wax -->
                    <div id="fvsw_serving" class="calculation_section">
                        <div class="form_group">
                            <label for="consumed_weight">Weight consumed:</label>
                            <input
                                type="number"
                                id="consumed_weight"
                                name="consumed_weight"
                                min="0.1"
                                step="0.1"
                                value="1"
                                required
                            >
                            <select id="consumed_weight_unit"
                                    name="consumed_weight_unit">
                                <option value="grams">Grams</option>
                                <option value="ounces">Ounces</option>
                            </select>
                        </div>
                    </div>

                    <!-- Troche -->
                    <div id="troche_serving" class="calculation_section" hidden>
                        <div class="form_group">
                            <label for="consumed_servings">Servings consumed:</label>
                            <input
                                type="number"
                                id="consumed_servings"
                                name="consumed_servings"
                                min="1"
                                step="1"
                                value="1"
                                required
                            >
                        </div>
                    </div>

                    <!-- Tincture -->
                    <div id="tincture_serving" class="calculation_section" hidden>
                        <div class="form_group">
                            <label for="consumed_volume">Volume consumed (mL):</label>
                            <input
                                type="number"
                                id="consumed_volume"
                                name="consumed_volume"
                                min="0.1"
                                step="0.1"
                                value="1"
                                required
                            >
                        </div>
                    </div>

                </div>

                <button type="submit">Calculate THC</button>
                <output id="calculation_message" aria-live="polite"></output>
            </form>

        </div>

    </div>

    <script>
        /** 
        * Display products from local storage.
        */
        { 
            const productSelect = document.getElementById("serving_selection");

            // Map product specifications to their display labels.
            const specificationLabels = {
                nug: "Full Nugs",
                premium: "Premium",
                small: "Small Buds",
                mixed: "Mixed Buds",
                rough: "Rough Cut",
                shake: "Shake",
                ground: "Ground",
                infused: "Infused Ground",
                resin: "Live Resin",
                rosin: "Live Rosin",
                sauce: "Live Sauce",
                distillate: "Live Resin Distillate",
                co2: "CO2",
                oil: "Oil",
                budder: "Budder",
                badder: "Badder",
                sugar: "Sugar",
                crumble: "Crumble",
                shatter: "Shatter",
                honeycomb: "Honeycomb",
            };

            // Products measured by weight.
            const weightTypes = new Set([
                "flower",
                "vape",
                "wax",
                "sand",
            ]);

            // Initialize fragment to store appended elements.
            const fragment = document.createDocumentFragment();

            // Iterate over local storage entries.
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);

                // Check for empty product.
                if (value === null) {
                    console.warn(`Product not found for key: ${key}`);
                    continue;
                }

                // Handle parsing errors.
                let product;

                try {
                    product = JSON.parse(value);
                } catch (error) {
                    console.warn(`Invalid product data for key: ${key}`, error);
                    continue;
                }

                // Destructure product to name related variables.
                const {
                    product_type: type,
                    product_specification: specification,
                    brand_name: brand,
                    product_name: name,
                    vape_spec_type: vapeSpec,
                } = product;

                // Build option label from available parts.
                const labelParts = [
                    brand,
                    name,
                    specificationLabels[specification] ?? "",
                    type ? toTitleCase(type) : "",
                    type === "vape" && vapeSpec
                        ? toTitleCase(vapeSpec)
                        : "",
                ];

                // Create option element.
                const optionElement = document.createElement("option");

                optionElement.value = key;
                optionElement.textContent = labelParts
                    .filter(Boolean)
                    .join(" ");

                // Assign the appropriate CSS class.
                optionElement.className = weightTypes.has(type)
                    ? "weight"
                    : type ?? "";

                // Append to fragment.
                fragment.appendChild(optionElement);
            }
            // Append fragment to element.
            productSelect.appendChild(fragment);
        }

        { // Calculate consumed dose section
            const calculationSelect = document.getElementById("serving_selection");

            const sections = {
                weight: document.getElementById("fvsw_serving"),
                troche: document.getElementById("troche_serving"),
                tincture: document.getElementById("tincture_serving")
            };

            function updateProductFields() {
                const productClass = calculationSelect.options[calculationSelect.selectedIndex].className;

                const section =
                    productClass === "troche" ? "troche" :
                    productClass === "tincture" ? "tincture" :
                    "weight";

                for (const [key, element] of Object.entries(sections)) {
                    const isActive = key === section;

                    element.hidden = !isActive;

                    // Hidden fields should not be required or submitted.
                    element.querySelectorAll("input, select").forEach(input => {
                        input.disabled = !isActive;
                    });
                }
            }

            calculationSelect.addEventListener("change", updateProductFields);
        }
    
        /**
         * Capitalize first letter of a string.
         * 
         * @param {string} string
         */
        function toTitleCase(string) {
            console.log("Line 615: string ", string);
            console.log("Line 616: string to title ", string.toLowerCase().replace(/\b\w/g, s => s.toUpperCase()));
            return string.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
