<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CannaDose</title>
</head>
<body class="">

    <h1 class="">CannaDose</h1>

    <div class="create_product">

        <h3>Save cannabis product</h3>

        <div class="form_group">

            <form id="product_form">

                <div class="form_group">
                    <label for="product_types">Select a product type:</label>
                    <select name="product_types" id="product_types">
                        <option value="flower">Flower</option>
                        <option value="vape">Vape</option>
                        <option value="sand">Sand</option>
                        <option value="wax">Wax</option>
                        <option value="troche">Troche</option>
                        <option value="tincture">Tincture</option>
                    </select>
                </div>

                <!-- Flower Specifications -->
                <div class="form_group" id="flower_specification_group">
                    <label for="flower_specification">Select the type of flower:</label>
                    <select name="flower_specification" id="flower_specification">
                        <option value="nug">Full Nug</option>
                        <option value="premium">Premium</option>
                        <option value="small">Small Buds</option>
                        <option value="popcorn">Popcorn Buds</option>
                        <option value="mixed">Mixed Buds</option>
                        <option value="rough">Rough cut</option>
                        <option value="shake">Shake</option>
                        <option value="ground">Ground</option>
                        <option value="infused">Infused ground</option>
                    </select>
                </div>

                <!-- Vape Specifications -->
                <div class="form_group" id="vape_specification_group" hidden>
                    <label for="vape_specification">Select the type of vape contents:</label>
                    <select name="vape_specification" id="vape_specification">
                        <option value="resin">Live Resin</option> 
                        <option value="rosin">Live Rosin</option>
                        <option value="distillate">Live Resin Distillate</option>
                        <option value="sauce">Live Sauce</option>
                        <option value="co2">CO2</option>
                        <option value="oil">Oil</option>
                    </select>
                </div>

                <div class="form_group" id="vape_specification_2_group" hidden>
                    <label for="vape_specification_2">Select the type of vape:</label>
                    <select name="vape_specification_2" id="vape_specification_2">
                        <option value="cartridge">Cartridge</option>
                        <option value="disposable">Disposable</option>
                        <option value="pod">Pod</option>
                    </select>
                </div>

                <!-- Wax Specifications -->
                <div class="form_group" id="wax_specification_group" hidden>
                    <label for="wax_specification">Select the type of wax:</label>
                    <select name="wax_specification" id="wax_specification">
                        <option value="budder">Budder</option>
                        <option value="badder">Badder</option>
                        <option value="sugar">Sugar</option>
                        <option value="crumble">Crumble</option>
                        <option value="shatter">Shatter</option>
                        <option value="resin">Live Resin</option>
                        <option value="rosin">Live Rosin</option>
                        <option value="sauce">Live Sauce</option>
                        <option value="honeycomb">Honeycomb</option>
                    </select>
                </div>

                <!-- Flower, vape, sand, wax -->
                <div id="weight_product" class="product_section">
                    <div class="form_group">
                        <label for="concentration_unit">Select the THC unit:</label>
                        <select id="concentration_unit" name="concentration_unit">
                            <option value="percent">Percent (%)</option>
                            <option value="mg">Milligrams (mg)</option>
                        </select>
                    </div>

                    <div class="form_group">
                        <label for="concentration">THC concentration:</label>
                        <input
                            type="number"
                            id="concentration"
                            name="concentration"
                            min="0"
                            max="100"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <label for="concentration_thca">THCA concentration (%):</label>
                        <input
                            type="number"
                            id="concentration_thca"
                            name="concentration_thca"
                            min="0"
                            max="100"
                            step="0.01"
                            placeholder="THCA %"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <label for="total_weight">Total product weight:</label>
                        <input
                            type="number"
                            id="total_weight"
                            name="total_weight"
                            min="0.1"
                            max="100"
                            step="0.1"
                            placeholder="Total weight"
                            required
                        >
                        <label for="weight_unit">Select weight unit:</label>
                        <select id="weight_unit" name="weight_unit">
                            <option value="grams">Grams</option>
                            <option value="ounces">Ounces</option>
                        </select>
                    </div>
                </div>
                
                <!-- Troche -->
                <div id="troche_product" class="product_section" hidden>
                    <div class="form_group">
                        <label for="troche_mg">THC per package (mg):</label>
                        <input
                            type="number"
                            id="troche_mg"
                            name="troche_mg"
                            min="1"
                            step="1"
                            placeholder="THC mg per package"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <label for="total_servings">Total servings:</label>
                        <input
                            type="number"
                            id="total_servings"
                            name="total_servings"
                            min="1"
                            step="1"
                            placeholder="Total servings per package"
                            required
                        >
                    </div>
                </div>

                <!-- Tincture -->
                <div id="tincture_product" class="product_section" hidden>
                    <div class="form_group">
                        <label for="mg_per_bottle">THC mg per bottle:</label>
                        <input
                            type="number"
                            id="mg_per_bottle"
                            name="mg_per_bottle"
                            min="1"
                            step="1"
                            placeholder="THC mg per bottle"
                            required
                        >
                    </div>

                    <div class="form_group">
                        <label for="total_volume">Total product volume (mL):</label>
                        <input
                            type="number"
                            id="total_volume"
                            name="total_volume"
                            min="0.1"
                            step="0.1"
                            placeholder="Bottle volume in mL"
                            required
                        >
                    </div>
                </div>

                <div class="form_group">
                    <label for="brand_name">Brand name:</label>
                    <input type="text" id="brand_name" name="brand_name" placeholder="Brand Name" required>
                </div>

                <div class="form_group">
                    <label for="product_name">Strain name:</label>
                    <input type="text" id="product_name" name="product_name" placeholder="Strain Name" required>
                </div>

                <div class="form_group">
                    <fieldset>
                        <legend>Strain Type</legend>
                        <label>
                            <input type="radio" value="hybrid" name="strain_types" required> 
                            Hybrid
                        </label>
                        <label>
                            <input type="radio" value="indica" name="strain_types"> 
                            Indica
                        </label>
                        <label>
                            <input type="radio" value="sativa" name="strain_types"> 
                            Sativa
                        </label>
                        <label>
                            <input type="radio" value="indica_dominant" name="strain_types"> 
                            Indica-dominant
                        </label>
                        <label>
                            <input type="radio" value="sativa_dominant" name="strain_types"> 
                            Sativa-dominant
                        </label>
                    </fieldset>
                    
                </div>

                <button type="submit">SAVE PRODUCT</button>
                <output id="save_product_message" aria-live="polite"></output>
            </form>

        </div>

    </div>

    <div class="product_calculation">

        <h3>Calculate consumed THC in mg</h3>

        <div class="form_group">

            <form id="calculation_form">

                <div class="form_group">
                    <label for="serving_selection">Select product:</label>
                    <select name="serving_selection" id="serving_selection" required>
                        <!-- option elements added by JS -->
                    </select>
                </div>

                <div class="form_group">

                    <!-- Flower, vape, sand, wax -->
                    <div id="fvsw_serving" class="calculation_section">
                        <div class="form_group">
                            <label for="consumed_weight">Weight consumed:</label>
                            <input
                                type="number"
                                id="consumed_weight"
                                name="consumed_weight"
                                min="0.1"
                                step="0.1"
                                value="1"
                                required
                            >
                            <select id="consumed_weight_unit"
                                    name="consumed_weight_unit">
                                <option value="grams">Grams</option>
                                <option value="ounces">Ounces</option>
                            </select>
                        </div>
                    </div>

                    <!-- Troche -->
                    <div id="troche_serving" class="calculation_section" hidden>
                        <div class="form_group">
                            <label for="consumed_servings">Servings consumed:</label>
                            <input
                                type="number"
                                id="consumed_servings"
                                name="consumed_servings"
                                min="1"
                                step="1"
                                value="1"
                                required
                            >
                        </div>
                    </div>

                    <!-- Tincture -->
                    <div id="tincture_serving" class="calculation_section" hidden>
                        <div class="form_group">
                            <label for="consumed_volume">Volume consumed (mL):</label>
                            <input
                                type="number"
                                id="consumed_volume"
                                name="consumed_volume"
                                min="0.1"
                                step="0.1"
                                value="1"
                                required
                            >
                        </div>
                    </div>

                </div>

                <button type="submit">Calculate THC</button>
                <output id="calculation_message" aria-live="polite"></output>
            </form>

        </div>

    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
